<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0e2340"/>
      <stop offset="50%" stop-color="#061224"/>
      <stop offset="100%" stop-color="#020712"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="eduTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Crest Gradient -->
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowLab" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes laserSweep {
      0% { transform: translateX(-240px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(240px); opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.95; }
    }
    .tachyon-ring {
      transform-origin: 600px 135px;
      animation: spinClockwise 28s linear infinite;
    }
    .hex-ring {
      transform-origin: 600px 135px;
      animation: spinCounter 20s linear infinite;
    }
    .crest-pulse {
      transform-origin: 600px 135px;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .sweep-beam {
      animation: laserSweep 3.5s ease-in-out infinite;
    }
    .star-twinkle {
      animation: twinkle 3s ease-in-out infinite;
    }
    .border-glow {
      animation: pulseGlow 5s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="440" rx="24" fill="url(#spaceBg)"/>

  <!-- Subtle Neural Grid Pattern -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/>
    <line x1="800" y1="0" x2="800" y2="440"/>
    <line x1="1000" y1="0" x2="1000" y2="440"/>
  </g>

  <!-- Ambient Light Halos -->
  <circle cx="600" cy="135" r="140" fill="#38BDF8" opacity="0.12" filter="url(#laserGlow)"/>
  <circle cx="600" cy="135" r="70" fill="#818CF8" opacity="0.22" filter="url(#laserGlow)"/>
  <circle cx="250" cy="220" r="160" fill="#10B981" opacity="0.04" filter="url(#laserGlow)"/>
  <circle cx="950" cy="220" r="160" fill="#6366F1" opacity="0.04" filter="url(#laserGlow)"/>

  <!-- Field of Twinkling Curriculum Nodes -->
  <g class="star-twinkle">
    <circle cx="100" cy="90" r="2.2" fill="#38BDF8"/>
    <circle cx="180" cy="180" r="1.8" fill="#34D399"/>
    <circle cx="280" cy="70" r="2.5" fill="#FCD34D"/>
    <circle cx="380" cy="120" r="1.6" fill="#818CF8"/>
    <circle cx="480" cy="60" r="2.0" fill="#38BDF8"/>
    <circle cx="720" cy="60" r="2.0" fill="#34D399"/>
    <circle cx="820" cy="120" r="1.7" fill="#FCD34D"/>
    <circle cx="920" cy="70" r="2.4" fill="#818CF8"/>
    <circle cx="1020" cy="180" r="1.8" fill="#38BDF8"/>
    <circle cx="1100" cy="90" r="2.2" fill="#34D399"/>
    <circle cx="140" cy="320" r="2.0" fill="#818CF8"/>
    <circle cx="320" cy="360" r="1.6" fill="#38BDF8"/>
    <circle cx="880" cy="360" r="1.8" fill="#FCD34D"/>
    <circle cx="1060" cy="320" r="2.0" fill="#34D399"/>
  </g>

  <!-- Central Emblem Geometry: Outer Tachyon Orbital Ring -->
  <g class="tachyon-ring">
    <circle cx="600" cy="135" r="92" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="8 8" opacity="0.45"/>
    <circle cx="692" cy="135" r="4.5" fill="#38BDF8" filter="url(#glowLab)"/>
    <circle cx="508" cy="135" r="4.5" fill="#34D399" filter="url(#glowLab)"/>
    <circle cx="600" cy="43" r="4" fill="#FCD34D" filter="url(#glowLab)"/>
    <circle cx="600" cy="227" r="4" fill="#818CF8" filter="url(#glowLab)"/>
  </g>

  <!-- Hexagonal Sacred Orbital Geometry -->
  <g class="hex-ring">
    <polygon points="600,55 670,95 670,175 600,215 530,175 530,95" fill="none" stroke="#818CF8" stroke-width="1.4" stroke-dasharray="10 6" opacity="0.6"/>
    <circle cx="670" cy="95" r="3.5" fill="#FCD34D" filter="url(#glowLab)"/>
    <circle cx="530" cy="175" r="3.5" fill="#38BDF8" filter="url(#glowLab)"/>
  </g>

  <!-- Central Academic Emblem (Mortarboard & Shield) -->
  <g class="crest-pulse">
    <!-- Outer Shield Hexagon -->
    <polygon points="600,75 655,105 655,165 600,195 545,165 545,105" fill="#061830" stroke="url(#crestGrad)" stroke-width="2.5" filter="url(#glowLab)"/>

    <!-- Inner Shield Plate -->
    <polygon points="600,86 644,111 644,159 600,184 556,159 556,111" fill="url(#crestGrad)" opacity="0.25"/>

    <!-- Graduation Mortarboard Icon -->
    <path d="M 600 102 L 638 122 L 600 142 L 562 122 Z" fill="#FCD34D" filter="url(#glowLab)"/>
    <path d="M 578 131 L 578 152 C 578 162 622 162 622 152 L 622 131 L 600 142 Z" fill="#F59E0B"/>
    <!-- Tassel -->
    <line x1="634" y1="122" x2="634" y2="150" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="634" cy="151" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Center Typography Deck -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="246"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="900" font-size="44" fill="url(#eduTitleGrad)"
          letter-spacing="8" filter="url(#glowLab)">
      ✦ EDUDOCENTE - STUDIO ✦
    </text>

    <!-- Subtitle 1 -->
    <text x="600" y="282"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="13.5" fill="#E2E8F0"
          letter-spacing="3.5">
      AUTONOMOUS PEDAGOGICAL ASSESSMENT · MULTI-AI CURRICULUM ENGINE · WORD &amp; EXCEL
    </text>

    <!-- Subtitle 2 -->
    <text x="600" y="304"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="600" font-size="11.5" fill="#94A3B8"
          letter-spacing="2">
      INSTITUTIONAL WORD (.DOCX) · SOLUCIONARIOS CON JUSTIFICACIÓN · MEMORIA MULTI-COLEGIO
    </text>

    <!-- Laser Divider Beam -->
    <line x1="320" y1="324" x2="880" y2="324" stroke="url(#cyberBorder)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <circle cx="600" cy="324" r="4" fill="#34D399" filter="url(#glowLab)"/>

    <!-- Laser Scanning Beam -->
    <g transform="translate(600, 324)">
      <circle class="sweep-beam" cx="0" cy="0" r="5" fill="#FCD34D" filter="url(#glowLab)"/>
    </g>
  </g>

  <!-- Bottom Symmetrical Technology Badges Deck -->
  <g transform="translate(600, 375)">
    <!-- Badge 1: Gemini & Claude -->
    <g transform="translate(-430, 0)">
      <rect x="-85" y="-17" width="170" height="34" rx="17" fill="#04182b" fill-opacity="0.9" stroke="#34D399" stroke-width="1.4"/>
      <circle cx="-62" cy="0" r="4" fill="#34D399" filter="url(#glowLab)"/>
      <text x="6" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#D1FAE5" letter-spacing="0.5">
        GEMINI 2.0 · CLAUDE 3.5
      </text>
    </g>

    <!-- Badge 2: GPT-4o & DeepSeek -->
    <g transform="translate(-215, 0)">
      <rect x="-82" y="-17" width="164" height="34" rx="17" fill="#04182b" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.4"/>
      <circle cx="-60" cy="0" r="4" fill="#38BDF8" filter="url(#glowLab)"/>
      <text x="6" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#E0F2FE" letter-spacing="0.5">
        GPT-4o · DEEPSEEK R1
      </text>
    </g>

    <!-- Badge 3: Mineduc Standards -->
    <g transform="translate(0, 0)">
      <rect x="-78" y="-17" width="156" height="34" rx="17" fill="#04182b" fill-opacity="0.9" stroke="#F59E0B" stroke-width="1.4"/>
      <circle cx="-56" cy="0" r="4" fill="#FBBF24" filter="url(#glowLab)"/>
      <text x="6" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#FEF3C7" letter-spacing="0.5">
        ESTÁNDAR MINEDUC
      </text>
    </g>

    <!-- Badge 4: Word & Excel -->
    <g transform="translate(215, 0)">
      <rect x="-82" y="-17" width="164" height="34" rx="17" fill="#04182b" fill-opacity="0.9" stroke="#818CF8" stroke-width="1.4"/>
      <circle cx="-60" cy="0" r="4" fill="#A5B4FC" filter="url(#glowLab)"/>
      <text x="6" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#EEF2FF" letter-spacing="0.5">
        WORD &amp; EXCEL OFICIAL
      </text>
    </g>

    <!-- Badge 5: Multi-Branding Memory -->
    <g transform="translate(430, 0)">
      <rect x="-85" y="-17" width="170" height="34" rx="17" fill="#04182b" fill-opacity="0.9" stroke="#EC4899" stroke-width="1.4"/>
      <circle cx="-62" cy="0" r="4" fill="#F472B6" filter="url(#glowLab)"/>
      <text x="6" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#FCE7F3" letter-spacing="0.5">
        MEMORIA MULTI-COLEGIO
      </text>
    </g>
  </g>

  <!-- Exterior Glowing Cybernetic Border -->
  <rect x="2" y="2" width="1196" height="436" rx="22" fill="none" stroke="url(#cyberBorder)" stroke-width="2.4" class="border-glow"/>
  <rect x="7" y="7" width="1186" height="426" rx="18" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.3"/>
</svg>
